name: Build & Release

# A release only ever comes from a pushed v* tag. Starting this workflow by
# hand (Actions, Run workflow) is a dry run: it tests and builds all three
# platforms and keeps the files as artifacts, and that is all. It can't make
# a release, because a hand-started run has a branch name where the tag
# should be, and a release named after a branch is a mess to clean up.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Looks at the tag before anything slow starts, so a wrong tag fails in a few
  # seconds instead of after the whole test run. The checks only apply to a
  # pushed tag. On a hand-started run this job does nothing and passes, so the
  # jobs after it still go ahead.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Every branch and tag, so the tagged commit can be looked up on main.
          fetch-depth: 0

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(tr -d '\r' < core/app_info.py | sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p')
          if [ -z "$version" ]; then
            echo "::error::Could not read APP_VERSION from core/app_info.py."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but APP_VERSION in core/app_info.py is $version. Fix the version, then delete the tag and tag again."
            exit 1
          fi

      - name: Check the tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit behind $GITHUB_REF_NAME is not on main. Get it onto main first, then tag the tip of main."
            exit 1
          fi

  # Runs the same test workflow the pushes and pull requests use. The build
  # below waits for it, so a failing test stops the release before anything
  # gets built or uploaded.
  test:
    needs: verify
    uses: ./.github/workflows/tests.yml

  # The same tests on Windows, at the same time as the Linux run, so the
  # release doesn't take longer. The build waits for this one too.
  test-windows:
    needs: verify
    uses: ./.github/workflows/tests-windows.yml

  build:
    needs: [test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            app: dist/RSVPReader/RSVPReader.exe
          - os: macos-latest
            platform: macos
            app: dist/RSVPReader.app/Contents/MacOS/RSVPReader
          # Linux is built on a fixed Ubuntu release, not on ubuntu-latest. A
          # build only starts on systems with the same glibc as the machine
          # that made it, or a newer one, and "latest" moves on by itself. A
          # build from a newer image stopped starting on Ubuntu 24.04, which
          # is the oldest release this one needs to run on.
          - os: ubuntu-24.04
            platform: linux
            app: dist/RSVPReader/RSVPReader
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate macOS .icns from app.png
        if: matrix.platform == 'macos'
        run: |
          mkdir icon.iconset
          sips -z 16 16     assets/icons/app.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icons/app.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icons/app.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icons/app.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icons/app.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icons/app.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icons/app.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icons/app.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icons/app.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icons/app.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icons/app.icns

      - name: Build with PyInstaller
        run: pyinstaller RSVPReader.spec --noconfirm --clean

      # Starts the packaged app with --self-check before anything is packaged
      # or uploaded. The tests run from source, so they can't see a build that
      # left out a library or a file. If the app reports a problem, or doesn't
      # finish, this fails the job and the release never gets created. The
      # report is printed in the log.
      - name: Install a virtual display
        # The packaged app opens a real window, and the Linux runner has no
        # screen. Windows and macOS runners have one.
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Check the packaged app works (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python .github/scripts/run_packaged_check.py "${{ matrix.app }}"

      - name: Check the packaged app works
        if: matrix.platform != 'linux'
        run: python .github/scripts/run_packaged_check.py "${{ matrix.app }}"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RSVPReader -DestinationPath RSVPReader-${{ github.ref_name }}-windows.zip

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RSVPReader.app ../RSVPReader-${{ github.ref_name }}-macos.zip

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar czf ../RSVPReader-${{ github.ref_name }}-linux.tar.gz RSVPReader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSVPReader-${{ matrix.platform }}
          path: RSVPReader-${{ github.ref_name }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only a pushed v* tag gets this far. Nothing else can start a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write the checksums
        # One SHA-256 line per download, with the plain file name, so someone
        # who has downloaded a file can check it against this list.
        run: |
          cd artifacts
          sha256sum ./*/RSVPReader-* | sed 's|  [^ ]*/|  |' > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/**/RSVPReader-*
            SHA256SUMS.txt