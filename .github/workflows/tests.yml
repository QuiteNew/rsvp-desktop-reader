name: Tests

# Runs the whole pytest suite on every push to main and every pull request,
# then checks the code with pyflakes. The release workflow also calls this one
# before it builds anything, so a tag can't produce a release from a commit
# whose tests are failing or that pyflakes finds a problem in.
#
# A push or pull request that only touches the files in paths-ignore doesn't
# start the run, because the suite takes about 15 minutes and none of those
# files can change its result. That covers the docs, RELEASING.md and the
# workflows and scripts that only build or check the packaged app. A change
# that also touches anything else still runs it.
#
# README.md, mkdocs.yml and LICENSE stay out of the list on purpose, because a
# test reads each of them (tests/test_app_info.py). So does this file, so a
# change to the list itself gets tested. Starting the workflow by hand and the
# release workflow calling it are not affected, they always run the whole
# suite.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'RELEASING.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/build-release.yml'
      - '.github/workflows/packaged-check.yml'
      - '.github/scripts/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'RELEASING.md'
      - '.github/workflows/docs.yml'
      - '.github/workflows/build-release.yml'
      - '.github/workflows/packaged-check.yml'
      - '.github/scripts/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The full history brings the release tags along. One test compares
          # APP_VERSION with the newest tag, and it can only do that if it can
          # see them.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install a virtual display
        # The GUI tests need a screen to draw on, and the runner has none.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest

      - name: Check the code with pyflakes
        # pyflakes reads the code without running it and reports things like
        # an import nothing uses or a name that is never defined. The tests
        # can pass with either of those in the code, so it gets its own step.
        run: python -m pyflakes core gui tests main.py