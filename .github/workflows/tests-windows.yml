name: Tests on Windows

# Runs the whole pytest suite on a Windows runner, the system most readers
# use, while the regular Tests workflow runs on Linux. The release workflow
# calls it next to the Linux run, so a tag can't produce a release from a
# commit that fails on Windows. It can also be started by hand (Actions, Run
# workflow). It is not part of the checks on every push, because it is slow
# and a failure that only shows up here shouldn't block ordinary work.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    # The suite takes about 18 minutes on a desktop PC. This is a safety net
    # so a stuck run doesn't use up the runner for hours.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The release tags, for the test that compares APP_VERSION with them.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the tests
        # -rs lists the skipped tests with their reasons, so it's visible
        # which ones Windows skips.
        run: python -m pytest -rs