name: Packaged app check

# An experiment, started by hand only (Actions, Run workflow). It builds the
# app on all three platforms exactly like the release does, then starts the
# packaged app with --self-check and fails if the app says something is wrong
# with it. The tests run from source, so they can't notice a build that left
# out a library or a file. This can.
#
# Once it has passed on all three platforms, the same step moves into
# build-release.yml and this file can go. It doesn't make a release and
# doesn't change anything in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            app: dist/RSVPReader/RSVPReader.exe
          - os: macos-latest
            platform: macos
            app: dist/RSVPReader.app/Contents/MacOS/RSVPReader
          # The same fixed Ubuntu release the real build uses.
          - os: ubuntu-24.04
            platform: linux
            app: dist/RSVPReader/RSVPReader
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate macOS .icns from app.png
        if: matrix.platform == 'macos'
        run: |
          mkdir icon.iconset
          sips -z 16 16     assets/icons/app.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icons/app.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icons/app.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icons/app.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icons/app.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icons/app.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icons/app.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icons/app.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icons/app.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icons/app.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/icons/app.icns

      - name: Build with PyInstaller
        run: pyinstaller RSVPReader.spec --noconfirm --clean

      - name: Install a virtual display
        # The packaged app opens a real window, and the Linux runner has no
        # screen. Windows and macOS runners have one.
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Start the packaged app with --self-check (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python .github/scripts/run_packaged_check.py "${{ matrix.app }}" --report self-check-report.txt

      - name: Start the packaged app with --self-check
        if: matrix.platform != 'linux'
        run: python .github/scripts/run_packaged_check.py "${{ matrix.app }}" --report self-check-report.txt

      - name: Keep the report
        # Also when the check failed, since that is when the report matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-check-report-${{ matrix.platform }}
          path: self-check-report.txt
          if-no-files-found: ignore